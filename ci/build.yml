# StationVoice · GitHub Actions 构建流水线
#
# 说明：GitHub 要求 OAuth App 令牌具备 `workflow` 权限才能向 .github/workflows/ 推送文件。
# 如果你的令牌没有该权限，请先在本地执行：
#     gh auth refresh -h github.com -s workflow
# 然后把这个文件移动回工作流目录：
#     mkdir -p .github/workflows && git mv ci/build.yml .github/workflows/build.yml
# 之后 push 到 main 或推送 v* 标签即可自动编译、自测、打包并发布 Release。
#
# 流水线内容：
#   1. build.cmd 编译（.NET Framework csc，零依赖）
#   2. StationVoice.exe --selftest 跑 10 项端到端自测
#   3. CLI 冒烟：mp3 / wav / m4a 三种格式各跑一遍整线
#   4. 打包便携 zip 并上传 artifact
#   5. 推送 v* 标签时创建 GitHub Release 并附上 zip

name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        shell: cmd
        run: |
          echo %PROCESSOR_ARCHITECTURE%
          dir "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe"

      - name: Compile (csc / .NET Framework 4.x)
        shell: cmd
        run: build.cmd

      - name: Self test (DSP + SSML + SAPI + MP3/M4A + batch)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\StationVoice.exe" -ArgumentList '--selftest','--out','test-output' -Wait -PassThru -NoNewWindow
          if (Test-Path "test-output\selftest-report.txt") {
            Get-Content "test-output\selftest-report.txt" -Encoding UTF8 | Write-Host
          }
          if ($proc.ExitCode -ne 0) {
            Write-Error "self test failed with exit code $($proc.ExitCode)"
            exit 1
          }

      - name: CLI smoke test (mp3 / wav / m4a)
        shell: pwsh
        run: |
          foreach ($fmt in @('mp3','wav','m4a')) {
            $proc = Start-Process -FilePath ".\StationVoice.exe" `
              -ArgumentList '--stops','templates/metro-stops.txt','--mode','metro','--line','地铁2号线','--terminal','浦东国际机场','--format',$fmt,'--out',"smoke-$fmt" `
              -Wait -PassThru -NoNewWindow
            if ($proc.ExitCode -ne 0) { Write-Error "CLI failed for $fmt"; exit 1 }
          }
          Get-ChildItem smoke-mp3 -File | Select-Object Name,Length | Format-Table | Out-String | Write-Host

      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = 'dev-' + $env:GITHUB_SHA.Substring(0,7) }
          New-Item -ItemType Directory -Force -Path package, release | Out-Null
          Copy-Item StationVoice.exe package\
          Copy-Item README.md, LICENSE package\
          Copy-Item -Recurse templates package\templates
          if (Test-Path "test-output\batch") { Copy-Item -Recurse "test-output\batch" "package\demo-audio" }
          if (Test-Path "smoke-mp3") { Copy-Item -Recurse "smoke-mp3" "package\demo-audio\metro-line" }
          Compress-Archive -Path "package\*" -DestinationPath "release\StationVoice-$tag-portable.zip" -Force
          Get-ChildItem release | Format-Table Name,Length | Out-String | Write-Host

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StationVoice-build
          path: |
            release/*.zip
            test-output/selftest-report.txt
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StationVoice ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release/*.zip
          draft: false
          prerelease: false
